ound:#111827;color:white;padding:12px 16px;border-radius:10px;z-index:99;display:none;box-shadow:0 10px 30px #0003}.toast.show{display:block;animation:toastIn .25s ease}.error-box{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:12px;display:none}.error-box.show{display:block}.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:18px;z-index:50}.modal-card{width:min(800px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:20px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.cal-head{font-size:12px;font-weight:800;color:var(--muted);padding:6px}.day{min-height:105px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px;cursor:pointer}.day:hover{border-color:#93c5fd;box-shadow:0 5px 16px #2563eb12}.daynum{font-weight:800;font-size:12px}.machine{margin-top:5px;padding:5px;border-radius:7px;background:#dbeafe;color:#1d4ed8;font-size:10px;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.pagination{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px}.pagination span{font-size:13px;color:var(--muted)}.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:end}.filters .field{margin:0;min-width:150px}.footer-note{position:fixed;bottom:8px;right:12px;font-size:10px;color:#94a3b8;z-index:2}.empty{padding:35px;text-align:center;color:var(--muted)}

let fb,auth,db;let me=null,profile=null,manpower=[],ots=[],unsub=[];let page="dashboard";let mpPage=1,otPage=1;const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

function table(rows,actions=true,printEach=false,manageView=false){if(!rows.length)return'<div class="empty">No records found.</div>';return`<div class="table-wrap"><table class="table"><thead><tr>${manageView?'<th>Seq</th><th>Submit Date</th><th>OT Date</th>':'<th>Date</th>'}<th>Department</th><th>Machine</th><th>Shift</th><th>Time</th><th>People</th><th>Status</th>${actions?'<th>Action</th>':''}</tr></thead><tbody>${rows.map(x=>`<tr>${manageView?`<td><b>OT-${String(x.sequence||fallbackSequence(x)).padStart(4,'0')}</b></td><td>${esc(fmt(x.submittedAt||x.createdAt)||'—')}</td><td>${esc(x.startDate||x.otDate||'—')}${x.endDate&&x.endDate!==x.startDate?`<br><small class="muted">to ${esc(x.endDate)}</small>`:''}</td>`:`<td>${esc(x.startDate||x.otDate)}</td>`}<td>${esc(x.department)}</td><td>${esc(x.machine||"—")}</td><td>${esc(x.otShift)}</td><td>${esc(x.startTime)}–${esc(x.endTime)}</td><td>${(x.employeeIds||[]).length}</td><td><span class="badge ${esc(x.status)}">${esc(x.status)}</span></td>${actions?`<td><div class="row-actions"><button class="btn btn-light" onclick="window.viewOT('${x.id}')">${profile?.role==='admin'?'Manage':'View'}</button>${printEach?`<button class="btn btn-light" onclick="window.printSingleOT('${x.id}')">🖨 Print / PDF</button>`:''}${manageView&&profile?.role==='admin'?`<button class="btn btn-danger" onclick="window.deleteOT('${x.id}')">Delete</button>`:''}</div></td>`:''}</tr>`).join('')}</tbody></table></div>`}
function dashboard(){const defaultMonth=new Date().toISOString().slice(0,7);const render=month=>{let hrs=0,c=0;const dept={};ots.filter(x=>x.status==='approved').forEach(x=>{const sd=x.startDate||x.otDate,ed=x.endDate||x.otDate,es=x.actualEmployeeSnapshots||x.employeeSnapshots||[];const span=Math.max(1,daysBetween(sd,ed));for(let i=0;i<span;i++){const d=addDays(sd,i);if(d.slice(0,7)!==month)continue;es.forEach(e=>{const h=Number(e.otHours||otHours(x.startTime,x.endTime));hrs+=h;c+=cost(e.currentSalary,h);dept[x.department||'Unknown']=(dept[x.department||'Unknown']||0)+cost(e.currentSalary,h)})}});const max=Math.max(1,...Object.values(dept));const chart=Object.entries(dept).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="chart-row"><strong>${esc(k)}</strong><div class="chart-track"><div class="chart-bar" style="width:${(v/max*100).toFixed(1)}%"></div></div><div class="chart-amount">${money(v)}</div></div>`).join('')||'<div class="empty">No approved OT for this month.</div>';$("content").innerHTML=`<h1 class="page-title">Dashboard</h1><div class="muted">Live overtime overview</div><div class="card section"><div class="dashboard-filter"><div class="field"><label>Month</label><input id="dashMonth" type="month" value="${month}"></div><button class="btn btn-primary" id="dashApply">Apply</button></div></div><div class="grid4 section"><div class="stat"><div class="label">Active Manpower</div><div class="value">${manpower.length}</div></div><div class="stat"><div class="label">Pending Requests</div><div class="value">${ots.filter(x=>x.status==='pending').length}</div></div><div class="stat"><div class="label">Approved OT Hours</div><div class="value">${hrs.toFixed(1)}</div></div><div class="stat"><div class="label">Estimated OT Cost</div><div class="value">${money(c)}</div></div></div><div class="section card"><div class="section-head"><strong>Department-wise OT Cost</strong><span class="muted">${month}</span></div><div class="chart-list">${chart}</div></div><div class="section card"><div class="section-head"><strong>Recent OT</strong><button class="btn btn-light" onclick="window.show('approval')">View</button></div>${table(ots.slice(0,8),false)}</div>`;$("dashApply").onclick=()=>render($("dashMonth").value)};render(defaultMonth)}
function daysBetween(a,b){if(!a||!b)return 1;return Math.floor((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000)+1}function addDays(d,n){const x=new Date(d+"T00:00:00");x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)}
function request(){if(!["shift_incharge","admin"].includes(profile.role)){$("content").innerHTML='<div class="card"><h2>Access restricted</h2></div>';return}const deps=[...new Set(manpower.map(x=>x.department).filter(Boolean))].sort();const machines=[...new Set(manpower.map(x=>x.machine).filter(Boolean))].sort();$("content").innerHTML=`<h1 class="page-title">OT Request</h1><div class="muted">Create a single-day or continuous multi-day request.</div><div class="card section"><form id="otForm"><div class="form-grid"><div class="field"><label>Department</label><select id="dept" required><option value="">Select</option>${deps.map(x=>`<option>${esc(x)}</option>`).join("")}</select></div><div class="field"><label>Machine</label><select id="machine" required><option value="">Select machine</option>${machines.map(x=>`<option>${esc(x)}</option>`).join("")}</select></div><div class="field"><label>Date Type</label><select id="dateType"><option value="single">Single Day</option><option value="range">Multiple Days</option></select></div><div class="field"><label>From Date</label><input id="startDate" type="date" required value="${new Date().toISOString().slice(0,10)}"></div><div class="field" id="endWrap"><label>To Date</label><input id="endDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>OT Shift</label><select id="shift"><option>A</option><option>B</option><option>C</option><option>G-1</option><option>G-2</option></select></div><div class="field"><label>Start Time</label><input id="startTime" type="time" required></div><div class="field"><label>End Time</label><input id="endTime" type="time" required></div><div class="field full"><label>Purpose</label><textarea id="purpose" rows="3" required></textarea></div><div class="field full"><label>Search Manpower</label><input id="workerSearch" placeholder="Employee ID or name"></div><div class="field full"><div id="workers" class="card" style="padding:8px;max-height:320px;overflow:auto" async function uploadCSV(){const f=$('csv')?.files?.[0];if(!f){toast('Choose CSV first');return}const text=await f.text(),lines=text.split(/\r?\n/).filter(x=>x.trim());if(lines.length<2){toast('CSV is empty');return}const parse=r=>r.match(/(".*?"|[^",]+)(?=,|$)/g)?.map(v=>v.replace(/^"|"$/g,'').trim())||[];const head=parse(lines[0]).map(x=>x.replace(/^\uFEFF/,''));const idx=n=>head.findIndex(x=>x.toLowerCase()===n.toLowerCase());let batch=fb.writeBatch(db),n=0;for(let i=1;i<lines.length;i++){const c=parse(lines[i]),id=c[idx('Employee_ID')];if(!id)continue;batch.set(fb.doc(db,'manpower',String(id)),{employeeId:String(id),name:c[idx('Name')]||'',department:c[idx('Department')]||'',machine:c[idx('Machine')]||'',shiftType:c[idx('Shift_type')]||'',mobile:c[idx('Mobile')]||'',joiningDate:c[idx('Joining_Date')]||'',designation:c[idx('Designation')]||'',currentSalary:Number((c[idx('Current_Salary')]||'0').replace(/,/g,''))||0,active:true,updatedAt:fb.serverTimestamp()},{merge:true});n++;if(n%400===0){await batch.commit();batch=fb.writeBatch(db)}}await batch.commit();toast(`${n} manpower records uploaded/updated`)}
function reports(){const approved=ots.filter(x=>x.status==='approved');$("content").innerHTML=`<h1 class="page-title">OT Reports</h1><div class="muted">Select filters and click Generate. No selection means all approved OT.</div><div class="card section"><div class="filters"><div class="field"><label>From</label><input id="rf" type="date"></div><div class="field"><label>To</label><input id="rt" type="date"></div><div class="field"><label>Department</label><select id="rd"><option value="">All Departments</option>${[...new Set(approved.map(x=>x.department).filter(Boolean))].sort().map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Machine</label><select id="rm"><option value="">All Machines</option>${[...new Set(approved.map(x=>x.machine).filter(Boolean))].sort().map(x=>`<option>${esc(x)}</option>`).join('')}</select></div></div><div class="report-actions"><button class="btn btn-primary" onclick="window.buildReport()">Generate</button><button class="btn btn-light" onclick="window.exportCSV()">Download Excel</button><button class="btn btn-light" onclick="window.printReport()">Print / Save PDF</button></div><div class="report-note">Generate the report first. If From/To are empty, all approved OT records are included.</div></div><div id="reportOut" class="section"></div>`;window.buildReport()}
window._reportRows=[];window.buildReport=()=>{let a=ots.filter(x=>x.status==='approved');const f=$("rf").value,t=$("rt").value,d=$("rd").value,m=$("rm").value;a=a.filter(x=>{const sd=x.startDate||x.otDate,ed=x.endDate||x.otDate;return(!f||ed>=f)&&(!t||sd<=t)&&(!d||x.department===d)&&(!m||x.machine===m)});window._reportRows=a;let total=0,hrs=0;const dept={},mach={};a.forEach(x=>{const es=x.actualEmployeeSnapshots||x.employeeSnapshots||[],span=Math.max(1,daysBetween(x.startDate||x.otDate,x.endDate||x.otDate));es.forEach(e=>{const h=Number(e.otHours||otHours(x.startTime,x.endTime));hrs+=h*span;const c=cost(e.currentSalary,h)*span;total+=c;dept[x.department||'—']??={hours:0,cost:0};dept[x.department||'—'].hours+=h*span;dept[x.department||'—'].cost+=c;mach[x.machine||'—']??={hours:0,cost:0};mach[x.machine||'—'].hours+=h*span;mach[x.machine||'—'].cost+=c})});$("reportOut").innerHTML=`<div id="printArea"><div class="print-company-header"><div class="company">RR IMPERIAL ELECTRICALS LIMITED</div><div class="address">Senpara, Kanchpur, Sonargaon, Narayanganj</div><div class="title">Over Time Management</div></div><div class="grid4"><div class="stat"><div class="label">Requests</div><div class="value">${a.length}</div></div><div class="stat"><div class="label">Employees</div><div class="value">${new Set(a.flatMap(x=>(x.actualEmployeeSnapshots||x.employeeSnapshots||[]).map(e=>e.employeeId))).size}</div></div><div class="stat"><div class="label">OT Hours</div><div class="value">${hrs.toFixed(1)}</div></div><div class="stat"><div class="label">Estimated Cost</div><div class="value">${money(total)}</div></div></div><div class="report-section"><div class="card"><h3>Department-wise</h3>${summaryTable(dept)}</div></div><div class="report-section"><div class="card"><h3>Machine-wise</h3>${summaryTable(mach)}</div></div><div class="card section"><h3>Detailed OT</h3>${table(a,false)}</div></div>`};function summaryTable(o){return`<div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Hours</th><th>Estimated Cost</th></tr></thead><tbody>${Object.entries(o).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.hours.toFixed(1)}</td><td>${money(v.cost)}</td></tr>`).join('')||'<tr><td colspan="3">No data</td></tr>'}</tbody></table></div>`}
window.exportCSV=()=>{const rows=window._reportRows||[];if(!rows.length){toast('No report data. Click Generate first.');return}let csv='Date,Department,Machine,Shift,Employee,OT Hours,Estimated Cost,Status\n';rows.forEach(x=>{const es=x.actualEmployeeSnapshots||x.employeeSnapshots||[],span=Math.max(1,daysBetween(x.startDate||x.otDate,x.endDate||x.otDate));es.forEach(e=>{const h=Number(e.otHours||otHours(x.startTime,x.endTime))*span,c=cost(e.currentSalary,Number(e.otHours||otHours(x.startTime,x.endTime)))*span;csv+=`"${x.startDate||x.otDate}","${x.department}","${x.machine||''}","${x.otShift}","${e.name}",${h.toFixed(2)},${c.toFixed(2)},"${x.status}"\n`})});const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='OT-Report.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};window.printReport=()=>{if(!window._reportRows?.length){toast('Generate a report first.');return}document.body.classList.add("printing-report");window.print();setTimeout(()=>document.body.classList.remove("printing-report"),500)};
function users(){
  if(profile.role!=="admin"){$('content').innerHTML=`<h1 class="page-title">Users</h1><div class="card section"><strong>Your current role: ${esc(profile.role)}</strong></div>`;return}
  $('content').innerHTML=`<h1 class="page-title">Users</h1><div class="card section"><strong>Your current role: ${esc(profile.role)}</strong><p class="muted" style="margin-top:8px">Admin trial-data cleanup</p></div>
  <div class="card section"><div class="section-head"><div><h3 style="margin:0">Delete Trial Data</h3><div class="muted">Choose exactly what you want to remove. Deleted data cannot be recovered from this app.</div></div></div>
  <div class="actions" style="margin-top:14px">
    <button class="btn btn-danger" onclick="window.cleanupData('ot')">Delete All OT Records</button>
    <button class="btn btn-danger" onclick="window.cleanupData('manpower')">Delete All Manpower</button>
    <button class="btn btn-danger" onclick="window.cleanupData('all')">Delete All Trial Data</button>
  </div></div>
  <div class="card section"><h3>Not included</h3><p class="muted">Login accounts and admin/role profiles are not deleted from this cleanup panel.</p></div>`
}
window.cleanupData=async type=>{
  if(profile.role!=="admin"){toast("Admin only");return}
  const label=type==='ot'?'all OT records':type==='manpower'?'all manpower records':'all trial data (OT + manpower)';
  if(!confirm(`Delete ${label}?\n\nThis is permanent.`))return;
  let remaining=10;
  const modal=document.createElement('div');modal.className='modal';modal.id='bulkDeleteModal';
  modal.innerHTML=`<div class="modal-card" style="max-width:450px;text-align:center"><div style="font-size:46px">⚠️</div><h2>Final Delete Confirmation</h2><p class="muted">You are about to permanently delete <b>${esc(label)}</b>.</p><button id="bulkFinal" class="btn btn-danger" disabled>Confirm Delete (${remaining})</button><button id="bulkCancel" class="btn btn-light" style="margin-left:7px">Cancel</button></div>`;
  document.body.appendChild(modal);
  const timer=setInterval(()=>{remaining--;const b=$('bulkFinal');if(!b)return;if(remaining<=0){clearInterval(timer);b.disabled=false;b.textContent='Confirm Delete';b.classList.add('dangerPulse')}else b.textContent=`Confirm Delete (${remaining})`},1000);
  $('bulkCancel').onclick=()=>{clearInterval(timer);modal.remove()};
  $('bulkFinal').onclick=async()=>{
    clearInterval(timer);$('bulkFinal').disabled=true;$('bulkFinal').textContent='Deleting…';
    try{
      const paths=[];
      if(type==='ot'||type==='all'){const snap=await fb.getDocs(fb.collection(db,'otRequests'));snap.forEach(d=>paths.push(['otRequests',d.id]))}
      if(type==='manpower'||type==='all'){const snap=await fb.getDocs(fb.collection(db,'manpower'));snap.forEach(d=>paths.push(['manpower',d.id]))}
      for(let i=0;i<paths.length;i+=400){const batch=fb.writeBatch(db);paths.slice(i,i+400).forEach(([c,id])=>batch.delete(fb.doc(db,c,id)));await batch.commit()}
      modal.remove();toast(`${label} deleted`)
    }catch(e){$('bulkFinal').disabled=false;$('bulkFinal').textContent='Confirm Delete';toast(friendly(e))}
  }
};
function listen(){const mq=fb.query(fb.collection(db,'manpower'),fb.where('active','==',true));unsub.push(fb.onSnapshot(mq,s=>{manpower=s.docs.map(d=>({id:d.id,...d.data()}));if(page==='manpower'||page==='request'||page==='dashboard')show(page)},e=>{$('firebaseError').textContent='Firestore error: '+friendly(e);$('firebaseError').classList.add('show')}));let q=fb.query(fb.collection(db,'otRequests'));if(profile.role==='shift_incharge')q=fb.query(fb.collection(db,'otRequests'),fb.where('requestedByUid','==',me.uid));unsub.push(fb.onSnapshot(q,s=>{ots=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>{const sa=Number(a.sequence)||0,sb=Number(b.sequence)||0;if(sa!==sb)return sb-sa;const da=a.submittedAt?.seconds||a.createdAt?.seconds||0,db=b.submittedAt?.seconds||b.createdAt?.seconds||0;return db-da});if(['dashboard','approval','manage','calendar','reports'].includes(page))show(page)},e=>toast('OT data error: '+friendly(e))))}
try{const [{initializeApp},{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut},{getFirestore,collection,doc,getDoc,getDocs,addDoc,setDoc,updateDoc,deleteDoc,query,where,onSnapshot,serverTimestamp,writeBatch}]=await Promise.all([import('https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js'),import('https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js'),import('https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js')]);fb={initializeApp,getAuth,signInWithEmailAndPassword,signOut,getFirestore,collection,doc,getDoc,getDocs,addDoc,setDoc,updateDoc,deleteDoc,query,where,onSnapshot,serverTimestamp,writeBatch};const app=initializeApp(cfg);auth=getAuth(app);db=getFirestore(app);onAuthStateChanged(auth,async u=>{cleanup();if(!u){$("login").classList.remove('hidden');$("app").classList.add('hidden');return}try{me=u;const s=await getDoc(doc(db,'users',u.uid));if(!s.exists()){await signOut(auth);loginErr('Your account has no role profile in Firestore.');return}profile={id:s.id,...s.data()};$("login").classList.add('hidden');$("app").classList.remove('hidden');$("userBadge").textContent=`${profile.name||u.email} • ${profile.role}`;document.querySelectorAll('.admin-only').forEach(x=>x.classList.toggle('hidden',profile.role!=='admin'));listen();show('dashboard')}catch(e){loginErr('Login succeeded, but Firestore role lookup failed: '+friendly(e))}})}catch(e){$('firebaseError').textContent='Firebase could not load. If you opened this HTML by double-clicking, please run it from localhost/GitHub Pages. Details: '+friendly(e);$('firebaseError').classList.add('show')}
window.show=show;
